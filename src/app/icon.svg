<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="amena-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182048" />
      <stop offset="100%" stop-color="#0e142e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.6" flood-color="#0a0e22" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners (22% radius) -->
  <rect width="64" height="64" rx="14" fill="url(#amena-bg)" />
  <!-- Subtle interior border line -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#304084" stroke-width="1" opacity="0.9" />
  <!-- Lowercase serif "a" letter -->
  <text x="32" y="45.5" font-family="'Playfair Display', Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="46" font-weight="700" fill="#f8f5ee" text-anchor="middle" filter="url(#shadow)">a</text>
</svg>

